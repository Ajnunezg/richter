name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build & Release (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release -p richter-cli -p richter-daemon
      - name: Compute SHA256
        id: sha
        run: |
          shasum -a 256 target/release/richter > richter-darwin-arm64.sha256
          shasum -a 256 target/release/richterd >> richter-darwin-arm64.sha256
          cat richter-darwin-arm64.sha256
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Create macOS tarball
        run: |
          tar czf richter-darwin-arm64.tar.gz -C target/release richter richterd
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: richter-darwin-arm64
          path: |
            richter-darwin-arm64.tar.gz
            richter-darwin-arm64.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            richter-darwin-arm64.tar.gz
            richter-darwin-arm64.sha256
          body: |
            ## Richter ${{ steps.version.outputs.VERSION }}

            ### Binaries

            | Binary | Architecture | OS |
            |--------|-------------|-----|
            | `richter` | arm64 (Apple Silicon) | macOS |
            | `richterd` | arm64 (Apple Silicon) | macOS |

            ### Verification

            ```bash
            shasum -a 256 -c richter-darwin-arm64.sha256
            ```

            ### Installation

            ```bash
            tar xzf richter-darwin-arm64.tar.gz
            chmod +x richter richterd
            mv richter richterd /usr/local/bin/
            ```
