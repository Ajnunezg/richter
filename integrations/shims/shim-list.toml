# Richter Shim List
# =================
# Complete catalog of all supported shim tools. Each entry maps a tool name
# to its category, default cache/dedupe policy, and resource class.
#
# Categories:
#   build          - Compilation/linking (cargo build, go build, xcodebuild)
#   test           - Test runners (pytest, cargo test, jest, go test)
#   lint           - Static analysis (clippy, eslint, ruff)
#   typecheck      - Type checking (tsc, mypy)
#   format         - Code formatters (prettier, rustfmt)
#   install        - Package/dependency installation (npm install, pip install)
#   dev-server     - Development servers and watchers (npm run dev, cargo watch)
#   migration      - Database migrations
#   destructive    - Potentially destructive commands (rm, git push --force)
#   unknown        - Unclassified commands (pass through by default)
#
# Resource classes:
#   heavy_build    - CPU/memory-intensive build operations
#   heavy_test     - CPU/memory-intensive test suites
#   light_lint     - Fast lint/typecheck operations
#   light_install  - Dependency installation (usually I/O-bound)
#   dev_server     - Long-running development server processes
#   unknown        - Default for unclassified commands
#
# Policy defaults:
#   cache: true    - Safe to cache; fingerprint must match exactly
#   cache: false   - Never cache (non-deterministic or destructive)
#   dedupe: true   - Safe to deduplicate when fingerprint matches
#   dedupe: false  - Never deduplicate (interactive, non-hermetic)

[[shims]]

# ---------------------------------------------------------------------------
# JavaScript / TypeScript ecosystem
# ---------------------------------------------------------------------------

[shims.npm]
category = "install"
cache = false
dedupe = false
resource_class = "light_install"
description = "Node package manager"

